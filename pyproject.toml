[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholar-pdf-kit"
version = "0.1.0"
description = "Automated Open Access Discovery and PDF downloader using the Unpaywall API"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
    "typer>=0.9.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "tenacity>=8.0.0",
    "scholar-search-kit",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "vcrpy>=5.0.0",
    "pytest-asyncio>=0.21.0"
]
extract = [
    "docling>=2.5.0",
    "requests",
    "lxml"
]

[project.scripts]
scholar-pdf = "scholar_pdf.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_pdf"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
scholar-search-kit = { path = "../scholar-search-kit", editable = true }
